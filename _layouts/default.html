<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0c0e">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="{{ '/' | relative_url }}">Daria Krivushkina</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>Full CV</a>
        <a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects/' %} aria-current="page"{% endif %}>Projects</a>
        <a href="{{ site.contact.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="{{ site.contact.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="{{ site.contact.email_url | escape }}" target="_blank" rel="noopener noreferrer">Email</a>
      </nav>
    </div>
  </header>

  {% include contact-links.html class="contact-rail" %}

  <main id="main-content" class="content{% if page.page_class %} {{ page.page_class | escape }}{% endif %}">
    {{ content }}
  </main>

  <footer class="site-footer">
    <nav aria-label="Footer navigation">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/cv/' | relative_url }}">Full Technical CV</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ site.contact.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="{{ site.contact.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="{{ site.contact.email_url | escape }}" target="_blank" rel="noopener noreferrer">Email</a>
    </nav>
    <a class="back-to-top" href="#main-content">Back to top ↑</a>
  </footer>
</body>
</html>
